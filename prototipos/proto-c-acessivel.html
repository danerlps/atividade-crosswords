<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protótipo C — Premium Acessível</title>
<style>
:root{--bg:#0B1220;--surface:#1E293B;--ink:#F8FAFC;--gold:#FBBF24;--correct:#22C55E;--present:#F59E0B;--absent:#475569;--focus:#FBBF24}
.hc{--bg:#000;--surface:#000;--ink:#fff;--gold:#FFD60A;--correct:#00A000;--present:#B88600;--absent:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;line-height:1.5;display:flex;flex-direction:column;align-items:center;min-height:100vh}
a.skip{position:absolute;left:-999px;background:var(--gold);color:#000;padding:10px;font-weight:800}a.skip:focus{left:8px;top:8px}
header{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--ink)}
header h1{font-size:22px;margin:0;letter-spacing:.06em}
.toggles{display:flex;gap:8px}button{font:inherit;cursor:pointer}
.toggles button{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{width:100%;max-width:560px;padding:16px}
ol.steps{padding-left:20px}ol.steps li{margin:12px 0}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.opts{display:flex;gap:10px;flex-wrap:wrap}.opts button{flex:1;min-height:52px;min-width:130px;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:12px;font-weight:700;font-size:16px}
.opts button[aria-pressed=true]{background:var(--gold);color:#000;border-color:var(--gold)}
.cta{width:100%;min-height:56px;background:var(--gold);color:#000;border:0;border-radius:12px;font-weight:800;font-size:19px;margin-top:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:15px;font-weight:700;margin:10px 0}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:8px;padding:4px 10px}
#board{display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:8px}.cell{width:60px;height:60px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.cell.active{border:3px solid var(--gold)}
.cell.correct{background:var(--correct);color:#fff;border-color:var(--correct)}
.cell.present{background:var(--present);color:#000;border-color:var(--present);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px)}
.cell.absent{background:var(--absent);color:#fff}
.cell .sym{font-size:14px;display:block;line-height:1}
#kb{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.krow{display:flex;gap:6px;justify-content:center}
.key{flex:1;min-height:56px;min-width:40px;background:var(--surface);color:var(--ink);border:2px solid #64748B;border-radius:12px;font-size:17px;font-weight:800;touch-action:manipulation}
.key.wide{flex:1.7}.key.correct{background:var(--correct);color:#fff}.key.present{background:var(--present);color:#000}.key.absent{background:var(--absent);color:#fff}
#live{position:absolute;left:-9999px}
#toast{background:var(--gold);color:#000;font-weight:800;padding:12px;border-radius:10px;display:none;margin:10px 0}
#end{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nomotion *{animation:none!important;transition:none!important}
@media(max-width:400px){.cell{width:52px;height:52px}}
</style>
</head>
<body>
<a class="skip" href="#kb">Pular para o teclado</a>
<div id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<header><h1>TERMO · C acessível</h1><div class="toggles"><button id="hcBtn" aria-pressed="false">Alto contraste</button><button id="moBtn" aria-pressed="false">Sem animação</button></div></header>
<main>
<div id="setup">
<ol class="steps">
<li><strong>Passo 1 — Modo:</strong> Diário (1 por dia) ou Livre.</li>
<li><strong>Passo 2 — Tema:</strong> escolha 1 de 4 categorias.</li>
<li><strong>Passo 3 — Nível:</strong> Fácil 8 · Médio 6 · Difícil 4 tentativas.</li>
</ol>
<div class="card"><h2>1 · Modo</h2><div class="opts" id="modos"><button data-v="diario" aria-pressed="true">☀️ Diário</button><button data-v="livre" aria-pressed="false">🎮 Livre</button></div></div>
<div class="card"><h2>2 · Categoria</h2><div class="opts" id="cats"><button data-v="animais" aria-pressed="true">🐯 Animais</button><button data-v="comidas" aria-pressed="false">🍕 Comidas</button><button data-v="escola" aria-pressed="false">📚 Escola</button><button data-v="objetos" aria-pressed="false">🪑 Objetos</button></div></div>
<div class="card"><h2>3 · Nível</h2><div class="opts" id="difs"><button data-v="8" aria-pressed="false">Fácil · 8 chances</button><button data-v="6" aria-pressed="true">Médio · 6 chances</button><button data-v="4" aria-pressed="false">Difícil · 4 chances</button></div></div>
<button class="cta" id="play">Começar jogo</button>
<p><button id="how" style="background:none;border:0;color:var(--gold);font-weight:800;text-decoration:underline">Como funciona? Verde ✓ = lugar certo · Laranja ◐ = outra posição · Cinza × = não tem</button></p>
</div>
<div id="game" hidden>
<p id="counter" style="font-weight:800">Tentativa 1 de 6</p>
<div class="legend" aria-hidden="true"><span class="badge">✓ lugar certo</span><span class="badge">◐ outra posição</span><span class="badge">× não tem</span></div>
<div id="toast" role="alert"></div>
<div id="board" role="group" aria-label="Tentativas"></div>
<div id="kb" aria-label="Teclado do jogo"></div>
</div>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle"></div>
</main>
<script>
const WORDS={animais:["ZEBRA","TIGRE","CORVO","CABRA","OVELH"],comidas:["ARROZ","FEIJA","PIZZA","BOLO","FRUTA"],escola:["LIVRO","CANET","QUADR","PROVA","ALUNO"],objetos:["MESAS","CADEI","PORTA","VASOS","TAPET"]};
const VALID=new Set(Object.values(WORDS).flat().concat(["TERMO","AUREO","IDEIA","SAGAZ"]));
let cat="animais",mode="diario",dif=6,secret="",row=0,col=0,tries=6,grid=[],over=false;
const $=s=>document.querySelector(s);
function wire(id,cb){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{$(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");cb(b.dataset.v)})}
wire("#cats",v=>cat=v);wire("#modos",v=>mode=v);wire("#difs",v=>dif=+v);
$("#hcBtn").onclick=e=>{document.documentElement.classList.toggle("hc");e.target.setAttribute("aria-pressed",document.documentElement.classList.contains("hc"))};
$("#moBtn").onclick=e=>{document.body.classList.toggle("nomotion");e.target.setAttribute("aria-pressed",document.body.classList.contains("nomotion"))};
$("#how").onclick=()=>say("Verde com símbolo check significa letra certa no lugar certo. Laranja com meio círculo significa letra certa em outra posição. Cinza com X significa que a letra não existe na palavra.");
function say(m){$("#live").textContent=m}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";say(m);clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2500)}
$("#play").onclick=()=>{secret=mode==="diario"?daily(cat):WORDS[cat][Math.floor(Math.random()*WORDS[cat].length)];tries=dif;row=0;col=0;over=false;grid=Array.from({length:tries},()=>Array(5).fill(""));$("#setup").hidden=true;$("#game").hidden=false;buildBoard();buildKB();counter();say(`Jogo iniciado. Categoria ${cat}. ${tries} tentativas. Digite 5 letras.`)};
function daily(c){const d=new Date();let a=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};return WORDS[c][Math.floor(r()*WORDS[c].length)]}
function counter(){$("#counter").textContent=`Tentativa ${Math.min(row+1,tries)} de ${tries} · Categoria ${cat} · Modo ${mode}`}
function buildBoard(){const b=$("#board");b.innerHTML="";for(let r=0;r<tries;r++){const d=document.createElement("div");d.className="row";d.setAttribute("role","row");d.setAttribute("aria-label",`Tentativa ${r+1} de ${tries}`);for(let c=0;c<5;c++){const s=document.createElement("div");s.className="cell"+(r===0?" active":"");s.id=`c${r}${c}`;d.appendChild(s)}b.appendChild(d)}}
function buildKB(){const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];const k=$("#kb");k.innerHTML="";rows.forEach((r,i)=>{const d=document.createElement("div");d.className="krow";if(i===2)d.appendChild(mk("CONFIRMAR","wide","Confirmar palavra"));[...r].forEach(ch=>d.appendChild(mk(ch,"",`Tecla ${ch}`)));if(i===2)d.appendChild(mk("APAGAR","wide","Apagar letra"));k.appendChild(d)})}
function mk(label,cls,al){const b=document.createElement("button");b.className="key "+cls;b.textContent=label;b.setAttribute("aria-label",al||label);b.dataset.k=label;b.onclick=()=>press(label);return b}
function press(k){if(over)return;if(k==="CONFIRMAR")return submit();if(k==="APAGAR"){if(col>0){col--;grid[row][col]="";draw()}}else if(/^[A-Z]$/.test(k)){if(col>3&&k.length>1)return;const ch=k.length>1?k:k;if(ch.length===1){grid[row][col]=ch;col++;draw()}}}
document.addEventListener("keydown",e=>{if($("#game").hidden)return;const k=e.key.toUpperCase();if(k==="ENTER")press("CONFIRMAR");else if(k==="BACKSPACE")press("APAGAR");else if(/^[A-Z]$/.test(k))press(k.normalize("NFD").replace(/[\u0300-\u036f]/g,""))});
function draw(){for(let c=0;c<5;c++){const el=$("#c"+row+c);el.innerHTML=grid[row][c]?grid[row][c]:"";document.querySelectorAll(".row").forEach((r,ri)=>r.querySelectorAll(".cell").forEach(x=>x.classList.toggle("active",ri===row)))}}
function submit(){const w=grid[row].join("");if(w.length<5)return toast("Faltam letras. Complete 5 letras e pressione Confirmar.");if(!VALID.has(w))return toast("Essa palavra não vale. Tente outra palavra.");paint(w);const desc=w.split("").map((ch,i)=>{const el=$("#c"+row+i);const st=el.dataset.st;return `${ch} ${st==="correct"?"correta":st==="present"?"presente em outra posição":"ausente"}`}).join(", ");say(`Tentativa ${row+1}: ${desc}.`);if(w===secret)return finish(true);row++;col=0;if(row>=tries)return finish(false);counter()}
function paint(w){const s=secret.split(""),g=w.split(""),res=Array(5).fill("absent"),left={};s.forEach(ch=>left[ch]=(left[ch]||0)+1);for(let i=0;i<5;i++)if(g[i]===s[i]){res[i]="correct";left[g[i]]--}for(let i=0;i<5;i++)if(res[i]!=="correct"&&left[g[i]]>0){res[i]="present";left[g[i]]--}const sym={correct:"✓",present:"◐",absent:"×"};for(let i=0;i<5;i++){const el=$("#c"+row+i);el.classList.add(res[i]);el.dataset.st=res[i];el.innerHTML=`<span>${g[i]}</span><span class="sym" aria-hidden="true">${sym[res[i]]}</span>`;const key=[...document.querySelectorAll(".key")].find(b=>b.textContent===g[i]);if(key){key.classList.remove("correct","present","absent");key.classList.add(res[i]);key.setAttribute("aria-label",`Tecla ${g[i]}, ${res[i]==="correct"?"correta":res[i]==="present"?"presente":"ausente"}`)}}}
function finish(win){over=true;counter();const e=$("#end");e.style.display="block";e.innerHTML=`<div class="card"><h2 id="endTitle">${win?"Você acertou!":"Não foi dessa vez"}</h2><p>${win?`A palavra era ${secret}, em ${row+1} de ${tries}.`:`A palavra era ${secret}. Tente outra categoria?`}</p><p><button class="cta" onclick="location.reload()">Jogar de novo</button></p></div>`;say(win?`Vitória! A palavra era ${secret}.`:`Derrota. A palavra era ${secret}.`);e.querySelector("button").focus()}
</script>
</body>
</html>
