<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protótipo B — Lúdico Escolar</title>
<style>
:root{--bg:#FFF7E6;--ink:#2D2A32;--primary:#7C3AED;--sun:#FFC93C;--correct:#22C55E;--candy:#FF6B9D;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,'SF Pro Rounded',system-ui,'Segoe UI',Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.hud{width:100%;max-width:520px;display:flex;gap:8px;justify-content:center;padding:12px}
.pill{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:900;box-shadow:0 4px 0 var(--ink);font-size:14px}
h1{margin:4px 0 0;font-size:30px}h1 .fox{font-size:34px}
.sub{opacity:.7;font-weight:700;margin-bottom:8px}
.setup{width:100%;max-width:520px;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:3px solid var(--ink);border-radius:16px;padding:14px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--ink);background:#fff;cursor:pointer}
.cat.on{outline:4px solid var(--sun)}.cat small{display:block;font-weight:700;opacity:.6}
.c-animais{background:#D9FBE8}.c-comidas{background:#FFE4C7}.c-escola{background:#DCEBFF}.c-objetos{background:#EADDFF}
.difs{display:flex;gap:8px}.dif{flex:1;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px;font-weight:900;box-shadow:0 4px 0 var(--ink);cursor:pointer}.dif.on{background:var(--sun)}
.modos{display:flex;gap:8px}.modo{flex:1;border:3px solid var(--ink);border-radius:14px;padding:10px;font-weight:900;background:#fff;cursor:pointer}.modo.on{background:var(--primary);color:#fff}
.cta{border:3px solid var(--ink);border-radius:999px;background:var(--primary);color:#fff;font-weight:900;font-size:20px;padding:14px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#board{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.row{display:flex;gap:7px;justify-content:center}
.cell{width:54px;height:54px;background:#fff;border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.cell.correct{background:var(--correct);color:#fff}.cell.present{background:var(--sun)}.cell.absent{background:#cfcfd4;color:#555}
.cell.pop{animation:pop .15s}@keyframes pop{50%{transform:scale(1.12)}}
.cell.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#kb{display:flex;flex-direction:column;gap:7px;width:100%;max-width:520px;padding:8px 12px 20px}
.krow{display:flex;gap:6px;justify-content:center}
.key{flex:1;min-height:56px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--ink);touch-action:manipulation;cursor:pointer}
.key.wide{flex:1.6;background:var(--sun)}.key.correct{background:var(--correct);color:#fff}.key.present{background:var(--sun)}.key.absent{background:#cfcfd4}
#toast{position:fixed;top:14px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;display:none;z-index:10}
#end{display:none;width:100%;max-width:520px;margin:10px 16px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:20px;text-align:center}
.confete{font-size:30px}
</style>
</head>
<body>
<div id="toast" role="alert"></div>
<div class="hud"><span class="pill">🪙 <span id="coins">120</span></span><span class="pill">🔥 <span id="streak">5</span></span><span class="pill">⭐ Nv.3</span></div>
<h1><span class="fox">🦊</span> Palavra Mágica <small style="font-size:12px">· B lúdico</small></h1>
<div class="sub">Adivinhe a palavra de 5 letras!</div>
<div class="setup" id="setup">
<div class="cats" id="cats">
<button class="cat c-animais on" data-v="animais">🐯 Animais<small>ZEBRA, TIGRE…</small></button>
<button class="cat c-comidas" data-v="comidas">🍕 Comidas<small>ARROZ, PIZZA…</small></button>
<button class="cat c-escola" data-v="escola">📚 Escola<small>LIVRO, PROVA…</small></button>
<button class="cat c-objetos" data-v="objetos">🪑 Objetos<small>MESAS, PORTA…</small></button>
</div>
<div class="modos" id="modos"><button class="modo on" data-v="diario">☀️ Diário</button><button class="modo" data-v="livre">🎮 Livre</button></div>
<div class="difs" id="difs"><button class="dif" data-v="8">😊 Fácil · 8</button><button class="dif on" data-v="6">😎 Médio · 6</button><button class="dif" data-v="4">🔥 Difícil · 4</button></div>
<button class="cta" id="play">▶ JOGAR!</button>
</div>
<div id="board"></div>
<div id="kb" hidden></div>
<div id="end"></div>
<script>
const WORDS={animais:["ZEBRA","TIGRE","CORVO","CABRA","OVELH"],comidas:["ARROZ","FEIJA","PIZZA","BOLO","FRUTA"],escola:["LIVRO","CANET","QUADR","PROVA","ALUNO"],objetos:["MESAS","CADEI","PORTA","VASOS","TAPET"]};
const VALID=new Set(Object.values(WORDS).flat().concat(["TERMO","AUREO","IDEIA","SAGAZ"]));
let cat="animais",mode="diario",dif=6,secret="",row=0,col=0,tries=6,grid=[],over=false,coins=120;
const $=s=>document.querySelector(s);
function wire(id,cb){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{$(id).querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v)})}
wire("#cats",v=>cat=v);wire("#modos",v=>mode=v);wire("#difs",v=>dif=+v);
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200)}
$("#play").onclick=()=>{secret=mode==="diario"?daily(cat):WORDS[cat][Math.floor(Math.random()*WORDS[cat].length)];tries=dif;row=0;col=0;over=false;grid=Array.from({length:tries},()=>Array(5).fill(""));$("#setup").style.display="none";$("#kb").hidden=false;buildBoard();buildKB()};
function daily(c){const d=new Date();let a=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};return WORDS[c][Math.floor(r()*WORDS[c].length)]}
function buildBoard(){const b=$("#board");b.innerHTML="";for(let r=0;r<tries;r++){const d=document.createElement("div");d.className="row";for(let c=0;c<5;c++){const s=document.createElement("div");s.className="cell";s.id=`c${r}${c}`;d.appendChild(s)}b.appendChild(d)}}
function buildKB(){const rows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];const k=$("#kb");k.innerHTML="";rows.forEach((r,i)=>{const d=document.createElement("div");d.className="krow";if(i===2)d.appendChild(mk("ENTER","wide"));[...r].forEach(ch=>d.appendChild(mk(ch,"")));if(i===2)d.appendChild(mk("⌫","wide"));k.appendChild(d)})}
function mk(ch,cls){const b=document.createElement("button");b.className="key "+cls;b.textContent=ch;b.dataset.k=ch;b.onclick=()=>press(ch);return b}
function press(k){if(over)return;if(k==="ENTER")return submit();if(k==="⌫"){if(col>0){col--;grid[row][col]="";draw()}}else if(col<5&&/^[A-Z]$/.test(k)){grid[row][col]=k;col++;draw(true)}}
function draw(p){for(let c=0;c<5;c++){const el=$("#c"+row+c);el.textContent=grid[row][c];if(p&&grid[row][c]){el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),160)}}}
document.addEventListener("keydown",e=>{if($("#kb").hidden)return;const k=e.key.toUpperCase();if(k==="ENTER")press("ENTER");else if(k==="BACKSPACE")press("⌫");else if(/^[A-Z]$/.test(k))press(k.normalize("NFD").replace(/[\u0300-\u036f]/g,""))});
function submit(){const w=grid[row].join("");if(w.length<5){shake();return toast("Faltam letras! Complete 5 letrinhas 🧩")}if(!VALID.has(w)){shake();return toast("Essa palavra não vale. Tente outra! 💡")}paint(w);if(w===secret)return finish(true);row++;col=0;if(row>=tries)return finish(false)}
function shake(){const r=document.querySelectorAll(".row")[row];r.querySelectorAll(".cell").forEach(c=>{c.classList.add("shake");setTimeout(()=>c.classList.remove("shake"),320)})}
function paint(w){const s=secret.split(""),g=w.split(""),res=Array(5).fill("absent"),left={};s.forEach(ch=>left[ch]=(left[ch]||0)+1);for(let i=0;i<5;i++)if(g[i]===s[i]){res[i]="correct";left[g[i]]--}for(let i=0;i<5;i++)if(res[i]!=="correct"&&left[g[i]]>0){res[i]="present";left[g[i]]--}for(let i=0;i<5;i++){$("#c"+row+i).classList.add(res[i]);const key=[...document.querySelectorAll(".key")].find(b=>b.dataset.k===g[i]);if(key){const rk={absent:0,present:1,correct:2};const cur=key.classList.contains("correct")?2:key.classList.contains("present")?1:0;if(rk[res[i]]>=cur){key.classList.remove("correct","present","absent");key.classList.add(res[i])}}}}
function finish(win){over=true;let gain=0;if(win){gain=50+10*(tries-row-1);coins+=gain;$("#coins").textContent=coins}const e=$("#end");e.style.display="block";e.innerHTML=`<div class="confete">${win?"🎉⭐🎉":"💪📚"}</div><h2>${win?"Você acertou!":"Quase! Era "+secret}</h2><p>${win?`+${gain} 🪙 · ${row+1}/${tries} tentativas`:"Na próxima você consegue!"}</p><p><button class="cta" onclick="location.reload()">Jogar de novo</button></p>`;e.scrollIntoView()}
</script>
</body>
</html>
